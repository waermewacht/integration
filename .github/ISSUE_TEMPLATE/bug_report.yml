name: Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden! Mit dem „Bericht für Fehlermeldung“ (Schaltfläche am Gerät) lässt sich das meist schnell eingrenzen.
        Hinweis: Wärmewacht ist eine Orientierung, keine Fachdiagnose – die Werte stammen aus den Zählern deiner Wärmepumpe.
  - type: textarea
    id: description
    attributes:
      label: Was ist passiert?
      description: Was hast du erwartet, was ist stattdessen passiert?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Wie lässt es sich nachvollziehen?
      placeholder: |
        1. Bosch Compress mit EMS-ESP, Vorlage „EMS-ESP“ eingerichtet
        2. …
  - type: input
    id: heat_pump
    attributes:
      label: Wärmepumpe und Anbindung
      placeholder: "Bosch CS6800i, EMS-ESP 3.8.6"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home-Assistant-Version
      description: Einstellungen → Info
      placeholder: "2026.10.4"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wärmewacht-Version
      description: HACS → Wärmewacht, oder Geräte & Dienste → Wärmewacht
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Betroffen
      multiple: true
      options:
        - Arbeitszahl
        - Takte / Laufzeiten
        - Abtauungen
        - Temperaturen
        - Einrichtung
        - weiß nicht
  - type: textarea
    id: diagnostics
    attributes:
      label: Bericht für Fehlermeldung
      description: >-
        Gerät von Wärmewacht → Diagnose → „Bericht für Fehlermeldung“ drücken und
        den Text aus der Benachrichtigung hier einfügen. Er enthält keine Entity-IDs,
        Namen oder Bereiche. Die ausführlichere Diagnose-Datei nur, wenn im Issue
        danach gefragt wird – was darin steht, erklärt die README unter „Fehler melden“.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Protokoll
      description: >-
        Einstellungen → System → Protokolle, nach „waermewacht“ filtern.
      render: text
