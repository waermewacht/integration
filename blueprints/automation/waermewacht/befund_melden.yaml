# Copies: speicherwacht/blueprints/automation/speicherwacht/befund_melden.yaml (derived)

blueprint:
  name: Wärmewacht – Befund melden / Report a finding
  description: >-
    Meldet, wenn eine Prüfung von Wärmewacht auffällig wird (Effizienz
    gesunken, auffälliges Takten, Heizstab bei milder Witterung oder bei
    Warmwasser, Warmwasser-Effizienz unter Vorjahr, auffällige
    Statusmeldungen): als Benachrichtigung in der Glocke und auf Wunsch
    zusätzlich aufs Handy mit der Home-Assistant-App. Unter „Weitere Aktionen“
    gehen auch Telegram und andere Dienste. Auf Wunsch auch, wenn alles wieder
    in Ordnung ist. Aufs Handy geht nur ein Wechsel von „in Ordnung“ auf
    „auffällig“, nicht jeder Neustart (die Glocke steht dann wieder da). Hast
    du mehrere Wärmepumpen, steht ihr Name im Titel. Die Nachricht gibt es auf
    Deutsch oder Englisch.


    Reports when a Wärmewacht check turns conspicuous (efficiency dropped,
    conspicuous cycling, backup heater in mild weather or for hot water, hot
    water efficiency below last year, conspicuous status messages): as a
    notification in the bell and, optionally, also on the phone with the Home
    Assistant app. Telegram and other services go under "More actions".
    Optionally also when it is fine again. The phone only gets a change from
    fine to conspicuous, not every restart (the bell shows it again). With
    more than one heat pump, the title names it. The message comes in German or
    English.
  domain: automation
  author: Wärmewacht
  homeassistant:
    min_version: "2026.4.0"
  source_url: https://github.com/waermewacht/integration/blob/main/blueprints/automation/waermewacht/befund_melden.yaml
  input:
    checks:
      name: Prüfungen / Checks
      description: >-
        Die Binärsensoren der Prüfungen eines oder mehrerer Wärmewacht-Geräte
        (Problem-Sensoren wie „Effizienz gesunken“, „Auffälliges Takten“). /
        The problem binary sensors of one or more Wärmewacht devices.
      selector:
        entity:
          multiple: true
          filter:
            integration: waermewacht
            domain: binary_sensor
            device_class: problem
    notify_device:
      name: Handy (optional) / Phone (optional)
      description: >-
        Ein Handy mit der Home-Assistant-App. Leer lassen für nur die Glocke. /
        A phone with the Home Assistant app. Leave empty for the bell only.
      default: ""
      selector:
        device:
          filter:
            integration: mobile_app
    language:
      name: Sprache der Nachricht / Language of the message
      default: de
      selector:
        select:
          options:
            - label: Deutsch
              value: de
            - label: English
              value: en
    notify_fine:
      name: Auch melden, wenn wieder in Ordnung / Also when fine again
      description: >-
        Aus: Die Meldung in der Glocke verschwindet still. / Off: the bell
        notification is dismissed silently.
      default: true
      selector:
        boolean: {}
    after_restart:
      name: Handy auch nach einem Neustart / Phone also after a restart
      description: >-
        Nach einem Neustart oder der Einrichtung ist eine Prüfung erst
        unbekannt. An: Auch „unbekannt → auffällig“ geht aufs Handy und an die
        weiteren Aktionen (dann nach jedem Neustart erneut). / After a restart
        or the setup a check is unknown at first. On: “unknown → conspicuous”
        also goes to the phone and the more actions (again after every
        restart).
      default: false
      selector:
        boolean: {}
    more:
      name: Weitere Aktionen (optional) / More actions (optional)
      icon: mdi:send
      description: >-
        Für Telegram, Signal, Sprachausgabe und Ähnliches. / For Telegram,
        Signal, speech output and the like.
      collapsed: true
      input:
        extra_actions:
          name: Weitere Aktionen / More actions
          description: >-
            Laufen mit dem fertigen Text, nach denselben Regeln wie das Handy.
            Nutzbar sind {{ title }} und {{ message }}. Beispiel Telegram:
            Aktion telegram_bot.send_message mit message: "{{ title }}: {{
            message }}". / Run with the finished text, by the same rules as the
            phone. You can use {{ title }} and {{ message }}. Example Telegram:
            action telegram_bot.send_message with message: "{{ title }}: {{
            message }}".
          default: []
          selector:
            action: {}
        notify_action:
          name: Zusätzlich senden an / Also send to (optional)
          description: >-
            Leer lassen, wenn nicht gebraucht. Sonst eine
            Benachrichtigungs-Aktion, z. B. notify.mobile_app_mein_handy
            (Entwicklerwerkzeuge → Aktionen). / Leave empty if not needed, else
            a notify action such as notify.mobile_app_my_phone.
          default: ""
          selector:
            text: {}

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input checks
    to: "on"
    id: problem
  - trigger: state
    entity_id: !input checks
    from: "on"
    to: "off"
    id: fine

variables:
  notify_action: !input notify_action
  notify_device: !input notify_device
  notify_fine: !input notify_fine
  after_restart: !input after_restart
  lang: !input language
  notification_id: "waermewacht_{{ trigger.entity_id }}"
  name: >-
    {{ trigger.to_state.name if trigger.to_state else trigger.entity_id }}
  # The phone's notify action: mobile_app names it after the registered device.
  phone_action: >-
    {%- set d = device_attr(notify_device, 'name') if notify_device else none -%}
    {{ 'notify.mobile_app_' ~ (d | slugify) if d else '' }}
  # Sent beyond the bell: a real change from fine, or (if wanted) from unknown.
  to_phone: >-
    {{ trigger.id == 'fine'
       or (trigger.from_state is not none and (trigger.from_state.state == 'off'
           or (after_restart and trigger.from_state.state in ['unknown', 'unavailable']))) }}
  # The heat pump of the check, for the title, but only with more than one:
  # counted are the devices with checks (binary sensors), one per heat pump
  # entry; gas and oil entries have none. Without a device just Wärmewacht.
  device: >-
    {%- set pumps = integration_entities('waermewacht')
          | select('match', 'binary_sensor[.]') | map('device_id')
          | reject('none') | unique | list -%}
    {{ (device_name(trigger.entity_id) or '') if pumps | count > 1 else '' }}
  head: "{{ 'Wärmewacht' ~ (' · ' ~ device if device else '') }}"
  # The finding in words, from the attributes of the binary sensor.
  detail: >-
    {%- set a = trigger.to_state.attributes if trigger.to_state else {} -%}
    {%- set de = lang == 'de' -%}
    {%- macro n(x, d) -%}
    {{- ('%.' ~ d ~ 'f') | format(x | float(0)) | replace('.', ',' if lang == 'de' else '.') -}}
    {%- endmacro -%}
    {%- if a.max_starts_per_hour is defined -%}
      {%- set parts = [] -%}
      {%- if 'starts_per_hour' in (a.triggers or []) -%}
        {%- set parts = parts + [(('max. ' ~ a.max_starts_per_hour ~ ' Starts in einer Stunde (Grenze ' ~ n(a.starts_per_hour_limit, 0) ~ ')') if de else ('max. ' ~ a.max_starts_per_hour ~ ' starts within one hour (limit ' ~ n(a.starts_per_hour_limit, 0) ~ ')'))] -%}
      {%- endif -%}
      {%- if 'critical_runs' in (a.triggers or []) -%}
        {%- set parts = parts + [((a.critical_runs_24h ~ ' kritisch kurze Läufe in 24 h') if de else (a.critical_runs_24h ~ ' critically short runs in 24 h'))] -%}
      {%- endif -%}
      {%- if 'starts_per_day' in (a.triggers or []) -%}
        {%- set parts = parts + [((a.starts_24h ~ ' Starts in 24 h (Grenze ' ~ n(a.starts_per_day_limit, 0) ~ ')') if de else (a.starts_24h ~ ' starts in 24 h (limit ' ~ n(a.starts_per_day_limit, 0) ~ ')'))] -%}
      {%- endif -%}
      {%- if not parts -%}
        {%- set parts = [(('max. ' ~ a.max_starts_per_hour ~ ' Starts/h, ' ~ a.short_runs_24h ~ ' Kurzläufe in 24 h') if de else ('max. ' ~ a.max_starts_per_hour ~ ' starts/h, ' ~ a.short_runs_24h ~ ' short runs in 24 h'))] -%}
      {%- endif -%}
      {{ parts | join(', ') }}
    {%- elif a.ratio_previous_same_weather is defined -%}
      {{ ('AZ Heizen ' ~ n(a.ratio_current, 2) ~ ' statt ' ~ n(a.ratio_previous_same_weather, 2) ~ ' bei gleichem Wetter in der Vorsaison') if de else ('COP heating ' ~ n(a.ratio_current, 2) ~ ' instead of ' ~ n(a.ratio_previous_same_weather, 2) ~ ' in the same weather last season') }}
    {%- elif a.aux_kwh_7d is defined -%}
      {{ ('Heizstab ' ~ n(a.aux_kwh_7d, 1) ~ ' kWh in 7 Tagen an milden Tagen') if de else ('backup heater ' ~ n(a.aux_kwh_7d, 1) ~ ' kWh in 7 days on mild days') }}
    {%- elif a.aux_share is defined -%}
      {{ ('Heizstab-Anteil ' ~ n(a.aux_share, 1) ~ ' % der Warmwasserladungen (' ~ n(a.aux_kwh, 2) ~ ' kWh in 30 Tagen)') if de else ('backup heater share ' ~ n(a.aux_share, 1) ~ ' % of the hot water charges (' ~ n(a.aux_kwh, 2) ~ ' kWh in 30 days)') }}
    {%- elif a.previous_ratio is defined -%}
      {{ ('AZ Warmwasser ' ~ n(a.ratio, 2) ~ ' statt ' ~ n(a.previous_ratio, 2) ~ ' im Vorjahr') if de else ('COP hot water ' ~ n(a.ratio, 2) ~ ' instead of ' ~ n(a.previous_ratio, 2) ~ ' last year') }}
    {%- elif a.most_frequent is defined -%}
      {%- set more = (a.entries_7d | int(0)) > (a.most_frequent_count | int(0)) -%}
      {{ (a.most_frequent ~ ' ' ~ a.most_frequent_count ~ '× in 7 Tagen' ~ ((', Schutz- und Störmeldungen zusammen ' ~ a.entries_7d ~ '×') if more else '')) if de else (a.most_frequent ~ ' ' ~ a.most_frequent_count ~ '× in 7 days' ~ ((', protection and fault messages ' ~ a.entries_7d ~ '× in all') if more else '')) }}
    {%- elif a.current_bar is defined -%}
      {%- set low = 'minimum' in (a.triggers or []) -%}
      {%- if de -%}
        Anlagendruck {{ n(a.current_bar, 2) }} bar in 7 Tagen{{ (', vorher bis ' ~ n(a.reference_bar, 2) ~ ' bar') if a.reference_bar is not none else '' }}{{ (', unter ' ~ n(a.min_bar, 2) ~ ' bar') if low else '' }}. Druck am Gerät ablesen und nachfüllen; sinkt er wieder, Fachbetrieb (Undichtigkeit, Ausdehnungsgefäß)
      {%- else -%}
        system pressure {{ n(a.current_bar, 2) }} bar in 7 days{{ (', before up to ' ~ n(a.reference_bar, 2) ~ ' bar') if a.reference_bar is not none else '' }}{{ (', below ' ~ n(a.min_bar, 2) ~ ' bar') if low else '' }}. Read the pressure at the unit and refill; if it drops again, call an installer (leak, expansion vessel)
      {%- endif -%}
    {%- endif -%}
  title: "{{ head ~ (': auffällig' if lang == 'de' else ': conspicuous') }}"
  message: >-
    {{ name }}{{ ': ' ~ detail if detail else '' }}
  fine_title: "{{ head ~ (': wieder in Ordnung' if lang == 'de' else ': fine again') }}"
  fine_message: >-
    {{ name }}{{ ': wieder in Ordnung' if lang == 'de' else ': fine again' }}

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: problem
        sequence:
          - action: persistent_notification.create
            data:
              notification_id: "{{ notification_id }}"
              title: "{{ title }}"
              message: "{{ message }}"
          - if:
              - condition: template
                value_template: "{{ to_phone }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ notify_action | trim != '' }}"
                then:
                  - action: "{{ notify_action | trim }}"
                    data:
                      title: "{{ title }}"
                      message: "{{ message }}"
              - if:
                  - condition: template
                    value_template: "{{ phone_action != '' }}"
                then:
                  - action: "{{ phone_action }}"
                    data:
                      title: "{{ title }}"
                      message: "{{ message }}"
              - sequence: !input extra_actions
      - conditions:
          - condition: trigger
            id: fine
        sequence:
          - if:
              - condition: template
                value_template: "{{ notify_fine }}"
            then:
              - variables:
                  title: "{{ fine_title }}"
                  message: "{{ fine_message }}"
              - action: persistent_notification.create
                data:
                  notification_id: "{{ notification_id }}"
                  title: "{{ title }}"
                  message: "{{ message }}"
              - if:
                  - condition: template
                    value_template: "{{ to_phone }}"
                then:
                  - if:
                      - condition: template
                        value_template: "{{ notify_action | trim != '' }}"
                    then:
                      - action: "{{ notify_action | trim }}"
                        data:
                          title: "{{ title }}"
                          message: "{{ message }}"
                  - if:
                      - condition: template
                        value_template: "{{ phone_action != '' }}"
                    then:
                      - action: "{{ phone_action }}"
                        data:
                          title: "{{ title }}"
                          message: "{{ message }}"
                  - sequence: !input extra_actions
            else:
              - action: persistent_notification.dismiss
                data:
                  notification_id: "{{ notification_id }}"
